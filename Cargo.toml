[workspace]
members = ["src-tauri", "crates/book-pdf", "crates/story-core", "crates/dev-host", "crates/pi-host", "crates/android-agent-host"]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
