[package]
name = "lishi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "lishi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json = "1"
bytes = "1"
tauri = { version = "2", features = [] }
# fs/io-util: the update download writes its file (tauri already enables both).
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "socks", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
zeroize = "1.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-fs = "2.7.0"
tauri-plugin-dialog = "2.8.2"
tempfile = "3"
# SHA-256 of the update package (already in the tree through wry).
sha2 = "0.10"
book-pdf = { path = "../crates/book-pdf" }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
jni21 = { package = "jni", version = "=0.21.1", default-features = false }
rustls-platform-verifier = "=0.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
