[package]
name = "lishi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "lishi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lishi-core = { path = "../crates/lishi-core" }
serde.workspace = true
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
jni21 = { package = "jni", version = "=0.21.1", default-features = false }
rustls-platform-verifier = "=0.7.1"
serde_json = "1"
zeroize = "1.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
tempfile = "3"
