[package]
name = "story-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "server", "macros", "transport-async-rw"] }
schemars = "1"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures", "loader"] }
sha2 = "0.10.9"
pi-host = { path = "../pi-host" }
base64 = "0.22"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "futures", "loader", "bindgen"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
