[package]
name = "android-agent-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "lishi_agent_host"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
story-core = { path = "../story-core" }
book-pdf = { path = "../book-pdf" }
sha2 = "0.10.9"
pi-host = { path = "../pi-host" }
jni = { version = "=0.21.1", default-features = false }
jni22 = { package = "jni", version = "=0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.1"
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
zeroize = "1.9"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "socks", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
tempfile = "3"
